<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>copy-button</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, sans-serif;
  }
  button {
    width: 100%;
    cursor: pointer;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: 1px solid rgba(120, 120, 120, 0.4);
    background: rgba(120, 120, 120, 0.06);
    color: inherit;
    font-size: 1rem;
    font-family: inherit;
    transition: background 0.15s ease;
  }
  button:hover { background: rgba(120, 120, 120, 0.22); }
  button:active { background: rgba(120, 120, 120, 0.32); }
  @media (prefers-color-scheme: dark) {
    body { color: #fafafa; }
  }
</style>
</head>
<body>
  <button id="btn" type="button"></button>
  <script>
    // Минимальная реализация протокола Streamlit Components (v1) на чистом
    // JS, без streamlit-component-lib — чтобы не тянуть внешние зависимости
    // (важно для деплоя на Streamlit Cloud) и не требовать сборки.
    (function () {
      let currentArgs = {};

      function postToStreamlit(type, extra) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: type }, extra || {}),
          "*"
        );
      }

      function setFrameHeight() {
        postToStreamlit("streamlit:setFrameHeight", {
          height: document.documentElement.scrollHeight,
        });
      }

      function setComponentValue(value) {
        postToStreamlit("streamlit:setComponentValue", {
          value: value,
          dataType: "json",
        });
      }

      // Пишет текст в буфер обмена. Пробует современный Clipboard API,
      // при неудаче — запасной вариант через execCommand('copy').
      async function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (err) {
            // падаем в fallback ниже
          }
        }
        try {
          const area = document.createElement("textarea");
          area.value = text;
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.focus();
          area.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(area);
          return ok;
        } catch (err) {
          return false;
        }
      }

      const btn = document.getElementById("btn");

      btn.addEventListener("click", async () => {
        // На всякий случай явно фокусируем документ фрейма — Clipboard API
        // требует, чтобы документ, вызывающий writeText(), был в фокусе.
        btn.focus();
        const text = currentArgs.text || "";
        const ok = await copyToClipboard(text);
        // Уникальный ts гарантирует, что Python увидит именно ЭТОТ клик как
        // новое значение, даже если текст и результат совпадают с прошлым разом.
        setComponentValue({ ok: ok, ts: Date.now(), text: text });
      });

      // Важно: сообщение streamlit:render, которое Streamlit шлёт ВНУТРЬ
      // компонента, НЕ содержит поля isStreamlitMessage (эта метка нужна
      // только на сообщениях, которые компонент отправляет НАРУЖУ, в сторону
      // Streamlit) — поэтому здесь фильтруем только по `type`.
      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.type !== "streamlit:render") return;
        currentArgs = data.args || {};
        btn.textContent = currentArgs.label || "Copy";
        btn.disabled = !currentArgs.text;
        setFrameHeight();
      });

      // Высоту сообщаем только из обработчика streamlit:render (см. выше) —
      // до componentReady Streamlit всё равно игнорирует setFrameHeight.
      postToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    })();
  </script>
</body>
</html>
